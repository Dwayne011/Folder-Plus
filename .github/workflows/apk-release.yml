name: Publish debug APK

# Manual: builds the debug APK and attaches it to a pre-release tagged with the
# run number, so it can be downloaded without digging through Actions artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Create pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "folder-plus-debug-${SHORT_SHA}.apk"
          gh release create "$TAG" "folder-plus-debug-${SHORT_SHA}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug APK build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Debug build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not signed for distribution; install via sideloading."
