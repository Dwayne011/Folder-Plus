name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK; ANDROID_HOME is set, so :app is included.
      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Lint and assemble debug APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon

      - name: Show lint findings
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: folder-plus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
